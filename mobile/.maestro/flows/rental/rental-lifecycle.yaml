appId: com.borrowhood.app
tags:
  - needs-fixtures
---
# Pending owner decisions live in the queue; inspecting a request never approves it.
- runFlow: ../auth/login-verified.yaml
- tapOn:
    id: "TabBar.Activity"
- tapOn:
    id: "Inbox.segment"
- tapOn: "Activity"
- scrollUntilVisible:
    element:
      text: "See queue"
- tapOn: "See queue"
- assertVisible:
    id: "Queue.approve.*"
- assertVisible:
    id: "Queue.decline.*"
- tapOn: "View request"
- assertVisible:
    id: "Transaction.button.queue"
- assertNotVisible:
    id: "Transaction.button.approve"
- assertNotVisible:
    id: "Transaction.button.decline"
- tapOn:
    id: "Transaction.button.queue"
- assertVisible:
    id: "Queue.approve.*"
- takeScreenshot: rental-lifecycle-queue
