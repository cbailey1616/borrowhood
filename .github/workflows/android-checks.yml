name: Android checks
on:
  pull_request:
    paths: ['mobile/**', '.github/workflows/android-checks.yml']
  push:
    branches: [feat/android-launch]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Test Android screens and actions
        run: npm run test:android
      - name: Export Android JavaScript
        env:
          CI: '1'
        run: npx expo export --platform android --output-dir /tmp/borrowhood-android
      - name: Generate Android native project
        env:
          CI: '1'
        run: npx expo prebuild --platform android --no-install
