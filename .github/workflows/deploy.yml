# Railway deploys the connected main branch; startup owns idempotent migrations.
# CI never uses production credentials or replays the initial schema on production.
name: Borrowhood checks

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  server:
    name: Server, auth and privacy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install disposable database tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16 postgresql-16-postgis-3
      - name: Install server dependencies
        working-directory: server
        run: npm ci
      - name: Check server JavaScript syntax
        working-directory: server
        run: find src scripts -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Test current API, migrations, auth and privacy
        working-directory: server
        env:
          PRIVACY_PG_BIN: /usr/lib/postgresql/16/bin
        run: npm test

  mobile:
    name: Mobile regression and iOS bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci
      - name: Test every mobile suite, including smoke tests
        working-directory: mobile
        run: npm run test:full -- --watch=false
      - name: Export production iOS JavaScript
        working-directory: mobile
        env:
          CI: '1'
        run: npx expo export --platform ios --output-dir /tmp/borrowhood-ci-ios
